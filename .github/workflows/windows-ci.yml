name: Windows CI

on:
  # Run on branch pushes so this workflow can validate its own introduction in a PR.
  # Push-triggered job checks are also eligible for pull-request status checks.
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore application
        run: dotnet restore WindowsApp/WindowsApp.csproj

      - name: Build application
        run: dotnet build WindowsApp/WindowsApp.csproj --configuration Release --no-restore -p:Platform=x64

  test-core:
    name: Test core library and SSH integration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install OpenSSH server for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openssh-server
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd

      - name: Restore tests
        run: dotnet restore WindowsApp/Skerry.Core.Tests/Skerry.Core.Tests.csproj

      - name: Run core tests
        run: dotnet test WindowsApp/Skerry.Core.Tests/Skerry.Core.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
